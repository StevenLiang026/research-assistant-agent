# The same four checks as the pre-commit hooks (.pre-commit-config.yaml), on every push and pull request:
# ruff, the secret and home-path scan over every tracked file, the README number reconciliation and the full
# offline test suite. The training extra (torch, peft and friends) is not installed: the tests that import it
# skip without it (pytest.importorskip). The tests that need data this public copy leaves out are skipped too
# (tests/conftest.py, needs_data).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the project and the dev group from the lock file
        run: uv sync --locked --group dev

      - name: ruff
        run: uv run --no-sync python -m ruff check .

      - name: No API keys or home paths in any tracked file
        run: git ls-files -z ':!uv.lock' | xargs -0 uv run --no-sync python scripts/check_no_secrets.py

      - name: README result numbers match the report
        run: uv run --no-sync python scripts/check_public_numbers.py

      - name: pytest (full suite, offline)
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
